name: Node Native CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  node-native-build:
    runs-on: macos-14
    timeout-minutes: 60
    defaults:
      run:
        working-directory: node
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build native addon
        run: npm run build:native

      - name: Run Node tests
        run: npm test
